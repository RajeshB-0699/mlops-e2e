name: MLOps CI-CD Pipeline

on:
  push:
    branches: [ "Main" ]
  pull_request:
    branches: [ "Main" ]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repo
          uses: actions/checkout@v3

        - name: Setup Python
          uses: actions/setup-python@v4
          with:
            python-version: "3.10"

        - name: create output directories
          run: mkdir -p "Github Actions/Trivy Automation"

        - name: Install dependencies
          run: |
            python -m venv menv
            source menv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            pip install flake8 black pylint pytest 

        - name: Run Trivy File system scan
          uses: aquasecurity/trivy-action@0.18.0
          with:
            scan-type: 'fs'
            scan-ref: '.'
            format: 'table'
            output: 'Github Actions/Trivy Automation/trivy-results.html'
            severity: 'HIGH,CRITICAL'
            scanners: 'vuln,secret,misconfig'

        - name: Pylint, flake8 and black tests
          run: |
            source menv/bin/activate
            pylint app.py train.py --output=pylint_report.text --exit-zero
            flake8 app.py train.py --ignore=E501,E302 --output-file=flake8-report.txt
            black app.py train.py
            echo "Completed!"
        - name: Run unit tests
          run: |
            source menv/bin/activate
            pytest tests/

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PAT_TOKEN }}
        
        - name: Build Docker Image
          uses: docker/build-push-action@v5
          with:
            context: .
            tags: my-app-mlops-01:latest
            load: true
            run: |
              docker build -t my-app-mlops-01 .

        

        - name: Upload Trivy FS Report
          uses: actions/upload-artifact@v4
          with:
            name: trivy-fs-report
            path: "Github Actions/Trivy Automation/trivy-results.html"

        - name: Upload Trivy Image Report
          uses: actions/upload-artifact@v4
          with:
           name: trivy-image-report
           path: "Github Actions/Trivy Automation/trivy-results-image.html"

        - name: Pushing Docker Images to Docker hub
          run: |
             docker tag my-app-mlops-01:latest ${{ secrets.DOCKER_USERNAME }}/my-app-mlops-01:latest
             docker push ${{ secrets.DOCKER_USERNAME }}/my-app-mlops-01:latest

        - name: Run Trivy Image Scan - Docker Image
          uses: aquasecurity/trivy-action@0.28.0
          with:
            
            image-ref: '${{ secrets.DOCKER_USERNAME }}/my-app-mlops-01:latest'
            format: 'table'
            output: 'Github Actions/Trivy Automation/trivy-results-image.html'
            ignore-unfixed: true
            vuln-type: 'os,library'
            severity: 'CRITICAL,HIGH'

        - name: Checking tools
          run : |
            docker --version
            aws --version

