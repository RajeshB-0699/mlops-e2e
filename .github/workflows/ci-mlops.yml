name: MLOps CI-CD Pipeline

on:
  push:
    branches: [ "Main" ]
  pull_request:
    branches: [ "Main" ]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repo
          uses: actions/checkout@v3

        - name: Setup Python
          uses: actions/setup-python@v4
          with:
            python-version: "3.10"
        - name: Install dependencies
          run: |
            python -m venv menv
            source menv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            pip install flake8 black pylint pytest 
        - name: Run Trivy File system scan
          uses: aquasecurity/trivy-action@0.18.0
          with:
            scan-type: 'fs'
            scan-ref: '.'
            format: 'sarif'
            output: 'trivy-results.sarif'
            severity: 'HIGH,CRITICAL'
            scanners: 'vuln,secret,misconfig'

        - name: Pylint, flake8 and black tests
          run: |
            source menv/bin/activate
            pylint app.py train.py --output=pylint_report.text --exit-zero
            flake8 app.py train.py --ignore=E501,E302 --output-file=flake8-report.txt
            black app.py train.py
            echo "Completed!"
        - name: Run unit tests
          run: |
            source menv/bin/activate
            pytest tests/
        
        - name: Build Docker Image
          run: |
            docker build -t my-app-mlops-01 .

        - name: Run Trivy Image Scan - Docker Image
          uses: aquasecurity/trivy-action@0.28.0
          with:
            
            image-ref: 'my-app-mlops-01:latest'
            format: 'table'
            output: 'trivy-results.html'
            ignore-unfixed: true
            vuln-type: 'os,library'
            severity: 'CRITICAL,HIGH'

        
        
 